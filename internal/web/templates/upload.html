{{define "upload.html"}}{{template "head" "アップロード"}}
<header>
<form class="search" method="get" action="/">
  <a href="/">←</a>
  <input type="search" name="q" placeholder="検索">
  <button>検索</button>
</form>
</header>
<main>
<form class="bar" method="post" action="/upload" enctype="multipart/form-data">
  <input type="file" name="files" multiple required>
  <input name="host" value="{{.Host}}" placeholder="ホスト名">
  {{if .Token}}<input type="password" name="token" placeholder="トークン" required>{{end}}
  <button>送る</button>
</form>
{{if .Lines}}<pre>{{range .Lines}}{{.}}
{{end}}</pre>{{end}}
</main>
{{template "foot"}}{{end}}
