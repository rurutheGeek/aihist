{{define "upload.html"}}{{template "head" (t "アップロード")}}
<div class="app">
{{template "side" .}}
<main class="main">
  <div class="bar">
    <button class="icon-btn menu" onclick="aihistMenu()" aria-label="{{t "一覧"}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="title">{{t "アップロード"}}</div>
  </div>
  <div class="scroll"><div class="col">
    <label class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
      <b>{{t "ファイルをドロップ、またはクリックして選ぶ"}}</b>
      <div class="kinds">
        <span><i style="background:{{toolColor "claude_code"}}"></i>Claude Code <code>.jsonl</code></span>
        <span><i style="background:{{toolColor "codex"}}"></i>Codex <code>rollout-*.jsonl</code></span>
        <span><i style="background:{{toolColor "antigravity"}}"></i>Antigravity <code>.db</code></span>
        <span><i style="background:{{toolColor "chatgpt"}}"></i>ChatGPT <code>.zip</code></span>
        <span><i style="background:{{toolColor "claude_ai"}}"></i>claude.ai <code>.json</code></span>
        <span><i style="background:{{toolColor "gemini"}}"></i>Gemini <code>takeout-*.zip</code></span>
      </div>
      <input type="file" multiple hidden id="files">
    </label>
    <div class="field"><span class="fl">{{t "マシン名"}}</span><input id="host" list="hosts" value="upload" autocomplete="off"><datalist id="hosts">{{range .Hosts}}<option value="{{.}}">{{end}}</datalist></div>
    {{if .AI}}<label class="grp row aiopt"><div class="rl">{{t "取り込んだ会話を AI で整理"}}</div><div class="rc"><input class="sw" type="checkbox" id="aiafter"></div></label>{{end}}
    <ul class="queue" id="queue"></ul>
    <a class="grp row link auto" href="/settings/upload" onclick="event.preventDefault();openSettings('upload')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><div class="rl"><span>{{t "取り込む種類"}}</span></div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></a>
  </div></div>
</main>
</div>
<script>
(function(){
  var T={wait:{{t "待機"}},up:{{t "送信中"}},imp:{{t "取り込み中"}},queue:{{t "順番待ち"}},ok:{{t "%d 件取り込み"}},same:{{t "%d 件は変更なし"}},open:{{t "開く"}},pick:{{t "中身を選ぶ"}},ai:{{t "AI で整理中"}},aidone:{{t "AI で整理した"}},kn:{{t "ナレッジの下書き %d 件"}}};
  var d=document.getElementById('drop'), f=document.getElementById('files'), q=document.getElementById('queue'), busy=false, todo=[];
  function size(n){return n>=1<<30?(n/(1<<30)).toFixed(1)+' GB':n>=1<<20?(n/(1<<20)).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
  function add(files){
    Array.from(files).forEach(function(file){
      var li=document.createElement('li');
      li.innerHTML='<div class="qn"><span class="nm"></span><small></small></div><div class="qs"></div><div class="bar2"><i></i></div>';
      li.querySelector('.nm').textContent=file.name; li.querySelector('small').textContent=size(file.size);
      li.querySelector('.qs').textContent=T.wait; q.appendChild(li); todo.push([file,li]);
    });
    next();
  }
  // 取り込んだあとの AI での整理
  function aiWatch(id,st){
    var s=document.createElement('span'); st.appendChild(s);
    (function poll(){fetch('/upload/jobs/'+id).then(function(x){return x.json()}).then(function(j){
      if(j.state==='done'||j.state==='error'){
        s.textContent=' · '+(j.state==='error'?j.error:T.aidone);
        if(j.imported){var a=document.createElement('a');a.href='/knowledge';a.textContent=T.kn.replace('%d',j.imported);st.appendChild(a)}
        return;
      }
      s.textContent=' · '+T.ai+' '+j.done+' / '+j.total; setTimeout(poll,2000);
    })})();
  }
  // 取り込みは裏で進むので、進み具合を見に行ってバーを伸ばす
  function watch(r,li,st,bar){
    li.className='run imp'; bar.style.width='0%'; st.textContent=T.queue;
    (function poll(){
      fetch('/upload/jobs/'+r.job).then(function(x){if(!x.ok)throw new Error(x.status);return x.json()}).then(function(j){
        if(j.state==='waiting'){st.textContent=T.queue}
        else if(j.state==='running'){st.textContent=T.imp+' '+j.done+' / '+j.total; bar.style.width=(j.total?j.done/j.total*100:0)+'%'}
        if(j.state==='error'){li.className='err'; st.textContent=j.error; return}
        if(j.state==='done'){
          li.className='ok'; st.innerHTML='';
          var s=document.createElement('span'); s.textContent=r.label+' · '+T.ok.replace('%d',j.imported)+(j.skipped?' · '+T.same.replace('%d',j.skipped):''); st.appendChild(s);
          var a=document.createElement('a'); a.href=r.href; a.textContent=T.open; st.appendChild(a);
          if(j.ai)aiWatch(j.ai,st);
          return;
        }
        setTimeout(poll,1000);
      }).catch(function(e){li.className='err'; st.textContent=String(e)});
    })();
  }
  function next(){
    if(busy||!todo.length)return; busy=true;
    var it=todo.shift(), file=it[0], li=it[1], st=li.querySelector('.qs'), bar=li.querySelector('.bar2 i');
    var fd=new FormData(); fd.append('host',document.getElementById('host').value); fd.append('files',file);
    var ao=document.getElementById('aiafter'); if(ao&&ao.checked)fd.append('ai','1');
    var x=new XMLHttpRequest(); x.open('POST','/upload');
    li.className='run'; st.textContent=T.up;
    x.upload.onprogress=function(e){ if(e.lengthComputable){bar.style.width=(e.loaded/e.total*100)+'%'; if(e.loaded===e.total)st.textContent=T.imp;} };
    x.onload=function(){
      var r; try{r=JSON.parse(x.responseText)[0]}catch(e){r={error:x.status+' '+x.responseText}}
      bar.style.width='100%';
      if(r.error){li.className='err'; st.textContent=r.error;}
      else if(r.export){li.className='ok'; st.textContent=r.label; openExport(r.href);}
      else if(r.job){watch(r,li,st,bar)}
      busy=false; next();
    };
    x.onerror=function(){li.className='err'; st.textContent='network error'; busy=false; next();};
    x.send(fd);
  }
  f.onchange=function(){add(f.files); f.value='';};
  ['dragenter','dragover'].forEach(function(e){d.addEventListener(e,function(ev){ev.preventDefault();d.classList.add('over')})});
  ['dragleave','drop'].forEach(function(e){d.addEventListener(e,function(ev){ev.preventDefault();d.classList.remove('over')})});
  d.addEventListener('drop',function(ev){add(ev.dataTransfer.files)});
})();
</script>

<div class="modal" id="exp"><div class="xbox" role="dialog" aria-label="{{t "claude.ai の書き出し"}}">
  <div class="mtop"><b>{{t "claude.ai の書き出し"}}</b><button class="icon-btn" type="button" data-close aria-label="{{t "閉じる"}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="xbody">
    <div class="grp xl"></div>
    <label class="drop xdrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><b>{{t "落とした zip をここへドロップ"}}</b><input type="file" multiple accept=".zip" hidden></label>
    <div class="xerr"></div>
    <div class="xdone" hidden><a class="btn pri" href="/">{{t "会話を見る"}}</a></div>
  </div>
</div></div>
<script>
(function(){
  var m=document.getElementById('exp'), base='', list=m.querySelector('.xl'), err=m.querySelector('.xerr'), fin=m.querySelector('.xdone');
  var X={dl:{{t "ダウンロード"}},wait:{{t "zip を待っている"}},got:{{t "取り込み中"}},imp:{{t "%d 件を取り込んだ"}},up:{{t "送信中"}},fail:{{t "送れなかった"}}};
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
  var poll;
  function draw(st){
    clearTimeout(poll);
    if(st.importing)poll=setTimeout(function(){fetch(base+'/state').then(function(r){return r.json()}).then(draw).catch(fail)},1500);
    list.innerHTML='';
    st.files.forEach(function(f){
      var row=document.createElement('div'); row.className='row';
      var right=f.State==='waiting'?'<a class="btn" target="_blank" rel="noreferrer noopener" href="'+esc(f.URL)+'">'+esc(X.dl)+'</a>'
        :f.State==='imported'?'<span class="ok">✓ '+esc(X.imp.replace('%d',f.Count))+'</span>':'<span class="mute spin">'+esc(X.got)+'</span>';
      row.innerHTML='<div class="rl"><span>'+esc(f.Label)+'</span><small>'+esc(f.State==='waiting'?X.wait:f.Filename)+'</small></div><div class="rc">'+right+'</div>';
      var a=row.querySelector('a.btn'); if(a)a.addEventListener('click',function(){a.classList.add('done')});
      list.appendChild(row);
    });
    fin.hidden=!st.done; if(st.done)fin.querySelector('a').href=st.href;
    m.querySelector('.xdrop').hidden=st.done;
  }
  function fail(e){err.textContent=X.fail+' ('+(e&&e.message||e)+')'}
  window.openExport=function(href){
    base=href; m.classList.add('open'); err.textContent='';
    fetch(base+'/state').then(function(r){return r.json()}).then(draw).catch(fail);
    history.replaceState(null,'','/upload#export='+href.replace('/exports/',''));
  };
  function close(){m.classList.remove('open'); history.replaceState(null,'','/upload')}
  m.addEventListener('click',function(e){if(e.target===m||e.target.closest('[data-close]'))close()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&m.classList.contains('open'))close()});
  function send(files){
    var fd=new FormData(); Array.from(files).forEach(function(x){fd.append('files',x)}); err.textContent=X.up;
    fetch(base+'/files',{method:'POST',body:fd}).then(function(r){if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json()}).then(function(a){
      err.textContent=a.results.filter(function(x){return x.error}).map(function(x){return x.name+': '+x.error}).join('\n');
      draw(a.state);
    }).catch(fail);
  }
  var box=m.querySelector('.xbox'), inp=m.querySelector('.xdrop input');
  inp.onchange=function(){send(inp.files);inp.value=''};
  ['dragenter','dragover'].forEach(function(e){box.addEventListener(e,function(ev){ev.preventDefault();box.classList.add('over')})});
  ['dragleave','drop'].forEach(function(e){box.addEventListener(e,function(ev){ev.preventDefault();if(e==='drop'||!box.contains(ev.relatedTarget))box.classList.remove('over')})});
  box.addEventListener('drop',function(ev){send(ev.dataTransfer.files)});
  var h=location.hash.match(/^#export=(.+)$/); if(h)openExport('/exports/'+h[1]);
})();
</script>
{{template "foot" .}}{{end}}
