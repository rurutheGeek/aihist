{{define "setup.html"}}{{template "head" "送る設定"}}
<div class="app">
{{template "side" .}}
<main class="main">
  <div class="bar">
    <button class="icon-btn menu" onclick="document.querySelector('.app').classList.add('open')" aria-label="一覧"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="title">送る設定</div>
  </div>
  <div class="scroll"><div class="col">
    {{range .Cmds}}<section class="setup">
      <h2>{{.OS}}</h2>
      <div class="cmdl"><span>入れる</span><code>{{.Install}}</code><button class="btn" type="button" onclick="aihistCopy(this)">コピー</button></div>
      <div class="cmdl"><span>消す</span><code>{{.Uninstall}}</code><button class="btn" type="button" onclick="aihistCopy(this)">コピー</button></div>
      <div class="dl"><a class="btn" href="{{.Script}}" download="{{.Name}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>{{.Name}}</a><a class="btn" href="{{.UScript}}" download="{{.UName}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>{{.UName}}</a></div>
    </section>{{end}}
  </div></div>
</main>
</div>
<script>
function aihistCopy(b){var t=b.previousElementSibling.textContent;navigator.clipboard.writeText(t).then(function(){var o=b.textContent;b.textContent='コピーした';setTimeout(function(){b.textContent=o},1400)})}
</script>
{{template "foot"}}{{end}}
