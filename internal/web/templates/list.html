{{define "list.html"}}{{template "head" "aihist"}}
<div class="app home">
{{template "side" .}}
<main class="main">
  <div class="welcome">
    <h1>aihist</h1>
    <div class="stats">
      {{range .Tools}}<a class="stat" href="/?tool={{.Name}}"><b>{{.Count}}</b><span><i style="background:{{toolColor .Name}}"></i>{{toolLabel .Name}}</span></a>{{end}}
    </div>
  </div>
</main>
</div>
{{template "foot" .}}{{end}}
